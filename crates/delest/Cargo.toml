[package]
name = "delest"
description = "Frees the disk space taken by developers' rebuildable artefacts, without touching their work."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme = "../../README.md"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4.6", features = ["derive"] }
delest-core = { path = "../delest-core" }
serde_json = "1"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
