name: Packages

# The installable packages for each system, kept as the run's artifacts: DMG, .deb
# and AppImage, Windows installer. Called by the CI and by the release.
on:
  workflow_call:
    inputs:
      systems:
        description: The systems to package for, as a JSON list.
        type: string
        default: '["macOS", "Linux", "Windows"]'
  workflow_dispatch:
    inputs:
      systems:
        description: The systems to package for, as a JSON list.
        type: string
        default: '["macOS", "Linux", "Windows"]'

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  package:
    name: package (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        name: ${{ fromJSON(inputs.systems) }}
    # The runner from the system's name: an `include` would add the systems left out.
    runs-on: ${{ matrix.name == 'macOS' && 'macos-latest' || matrix.name == 'Windows' && 'windows-latest' || 'ubuntu-latest' }}
    env:
      TAURI: npx --yes @tauri-apps/cli@2.12.3
      # linuxdeploy is itself an AppImage; the runners have no FUSE to mount it.
      APPIMAGE_EXTRACT_AND_RUN: "1"
    steps:
      - uses: actions/checkout@v7
      - name: Interface libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          # The macOS app is universal: Intel and Apple Silicon.
          targets: ${{ matrix.name == 'macOS' && 'x86_64-apple-darwin,aarch64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
      - name: Build the packages
        shell: bash
        run: ./scripts/package.sh
      - uses: actions/upload-artifact@v4
        with:
          name: delest-${{ matrix.name }}
          path: |
            target/**/release/bundle/dmg/*.dmg
            target/release/bundle/deb/*.deb
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
